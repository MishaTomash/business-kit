<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#d5eedc" />
    <title>%BRAND%</title>
    <meta name="description" content="" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <!--page-meta-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <symbol id="i-star" viewBox="0 0 100 100">
        <polygon points="50.00,2.00 61.76,33.82 95.65,35.17 69.02,56.18 78.21,88.83 50.00,70.00 21.79,88.83 30.98,56.18 4.35,35.17 38.24,33.82" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-logo" viewBox="0 0 48 48">
        <rect x="4" y="9" width="40" height="35" rx="9" style="fill: var(--logo-edge, #1f7a47)" />
        <rect x="4" y="4" width="40" height="35" rx="9" style="fill: var(--logo-face, #0d2a1c)" />
        <polygon points="24.00,10.00 26.94,17.45 34.94,17.95 28.76,23.05 30.76,30.80 24.00,26.50 17.24,30.80 19.24,23.05 13.06,17.95 21.06,17.45" fill="#ffb81c" stroke="#ffb81c" stroke-width="2.2" stroke-linejoin="round" />
      </symbol>
    </svg>

    <a class="skip" href="#app">Перейти до змісту</a>

    <header class="nav">
      <div class="wrap nav__in">
        <a class="logo" href="/" aria-label="%BRAND%, на головну">
          <svg width="34" height="34" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
          <span>%BRAND%</span>
        </a>
        <nav class="nav__links" aria-label="Основна навігація">
          <a href="/" data-nav="home">Головна</a>
          <a href="/games" data-nav="games">Ігри</a>
          <a href="/#how">Як це працює</a>
          <a href="/#prices">Ціни</a>
          <a href="/#faq">Питання</a>
        </nav>
        <div class="nav__end">
          <details class="menu">
            <summary class="menu__btn">Меню</summary>
            <nav class="menu__panel" aria-label="Меню">
              <a href="/" data-nav="home">Головна</a>
              <a href="/games" data-nav="games">Ігри</a>
              <a href="/#how">Як це працює</a>
              <a href="/#prices">Ціни</a>
              <a href="/#faq">Питання</a>
            </nav>
          </details>
          <a class="key key--sm" href="%VITE_TELEGRAM_URL%" target="_blank" rel="noopener" data-magnetic><span class="key__face">Написати</span></a>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"><!--app--></main>

    <footer class="foot">
      <div class="wrap foot__in">
        <a class="logo" href="/"><svg width="30" height="30" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg><span>%BRAND%</span></a>
        <p class="foot__note">Прогнози на сайті — модель, а не гарантія доходу.</p>
        <nav class="foot__legal" aria-label="Юридичні документи">
          <a href="/offer">Публічна оферта</a>
          <a href="/privacy">Політика конфіденційності</a>
        </nav>
        <p class="foot__copy">© <span>2026</span> %BRAND%</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
