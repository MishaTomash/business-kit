<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <title>Business Kit: готовий бізнес у Telegram з планом заробітку</title>
    <meta
      name="description"
      content="Готові Telegram-боти під ваш бренд разом з покроковим планом, як на них заробити. Без коду й досвіду: ми запускаємо, ви працюєте за планом."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Business Kit: готовий бізнес у Telegram з планом заробітку" />
    <meta property="og:description" content="Бот, план розвитку й підтримка. Без коду й досвіду." />
    <meta property="og:locale" content="uk_UA" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <a class="skip-link" href="#app">Перейти до змісту</a>

    <!-- Navigation (persistent across routes) -->
    <header class="nav" data-nav>
      <div class="container nav__inner">
        <a class="logo" href="#/" aria-label="Business Kit, на головну">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" />
            <path d="M8.5 12.2l2.4 2.4 4.6-5.1" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Business Kit</span>
        </a>

        <nav class="nav__links" aria-label="Основна навігація">
          <a href="#/" data-scroll="categories">Напрями</a>
          <a href="#/" data-scroll="offer">Що ви отримуєте</a>
          <a href="#/" data-scroll="how">Як це працює</a>
          <a href="#/" data-scroll="faq">Питання</a>
        </nav>

        <a class="btn btn--secondary btn--sm" href="%VITE_TELEGRAM_URL%" target="_blank" rel="noopener" data-magnetic="0.2">
          <span data-icon="send"></span>
          <span class="nav__cta-text">Написати</span>
        </a>
      </div>
    </header>

    <!-- Routed content: rendered by src/main.ts (views in src/views/) -->
    <main id="app" tabindex="-1">
      <noscript>
        <p class="container" style="padding-top: 120px">Для роботи сайту увімкніть JavaScript.</p>
      </noscript>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <a class="logo" href="#/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" />
            <path d="M8.5 12.2l2.4 2.4 4.6-5.1" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Business Kit</span>
        </a>
        <p class="footer__meta">© <span data-year>2026</span> Business Kit. Прогнози на сайті є моделлю, а не гарантією доходу.</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
