<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Дизайн-система «ДНК»</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <symbol id="i-star" viewBox="0 0 100 100">
        <polygon points="50.00,2.00 61.76,33.82 95.65,35.17 69.02,56.18 78.21,88.83 50.00,70.00 21.79,88.83 30.98,56.18 4.35,35.17 38.24,33.82" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" />
      </symbol>
      <symbol id="i-approx" viewBox="0 0 24 24">
        <path d="M5 9.5c2.3-1.9 4.7-1.9 7 0s4.7 1.9 7 0M5 15.5c2.3-1.9 4.7-1.9 7 0s4.7 1.9 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <!-- Логотип: мембрана-кільце й два ланцюги ДНК. Кольори з CSS (--logo-ring, --logo-a, --logo-b): на світлому тлі темна версія. -->
      <symbol id="i-logo" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.1" fill="none" style="stroke: var(--logo-ring, #f1ece1)" stroke-width="1.8" />
        <path d="M8.7 6.4C13.2 9.2 10.8 14.8 15.3 17.6" fill="none" style="stroke: var(--logo-a, #ee8466)" stroke-width="2.4" stroke-linecap="round" />
        <path d="M15.3 6.4C10.8 9.2 13.2 14.8 8.7 17.6" fill="none" style="stroke: var(--logo-b, #a9b3aa)" stroke-width="2.4" stroke-linecap="round" />
      </symbol>
    </svg>
    <main id="sys"></main>
    <script type="module" src="./system/system.ts"></script>
  </body>
</html>
